[workspace]
members = ["crates/nodivu-core", "crates/nodivu-engine", "crates/nodivu-ipc", "crates/nodivu-app-backend", "crates/nodivu-block", "crates/nodivu-plugin-gain", "crates/nodivu-plugin-tone", "crates/nodivu-clap-host"]
resolver = "3"

[workspace.package]
license = "MIT"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
nodivu-block = { path = "crates/nodivu-block" }
nodivu-plugin-gain = { path = "crates/nodivu-plugin-gain" }
nodivu-plugin-tone = { path = "crates/nodivu-plugin-tone" }
nodivu-ipc = { path = "crates/nodivu-ipc" }
nodivu-core = { path = "crates/nodivu-core" }
nodivu-engine = { path = "crates/nodivu-engine" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.26.0", features = ["serde"] }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Threading", "Win32_Security"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
